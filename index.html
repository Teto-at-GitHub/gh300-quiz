<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GH-300 GitHub Copilot Certification Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f3ee;--surface:#ffffff;--surface2:#f0ede6;
  --border:rgba(60,55,45,0.15);--border-med:rgba(60,55,45,0.28);
  --text:#1c1a17;--text-muted:#6b6558;--text-hint:#9d9688;
  --accent:#2a5f8f;--accent-bg:#e8f1f8;
  --success:#2d6a3f;--success-bg:#e8f4ec;
  --danger:#8f2a2a;--danger-bg:#f8e8e8;
  --warn:#7a5500;--warn-bg:#fdf3d8;
  --radius:10px;--radius-lg:14px
}
@media(prefers-color-scheme:dark){:root{
  --bg:#181614;--surface:#221f1b;--surface2:#2c2924;
  --border:rgba(255,250,240,0.1);--border-med:rgba(255,250,240,0.2);
  --text:#f0ece4;--text-muted:#a89e8e;--text-hint:#6e6458;
  --accent:#6aabde;--accent-bg:#1a2e3d;
  --success:#5db87a;--success-bg:#162318;
  --danger:#e07070;--danger-bg:#2a1616;
  --warn:#d4a84b;--warn-bg:#261e08
}}
html{font-size:16px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
.shell{max-width:740px;margin:0 auto;padding:2.5rem 1.5rem 4rem}
.site-header{margin-bottom:2.5rem;border-bottom:1px solid var(--border);padding-bottom:1.5rem}
.site-header h1{font-family:'DM Serif Display',serif;font-size:1.9rem;font-weight:400;letter-spacing:-0.02em;line-height:1.2;margin-bottom:0.3rem}
.site-header h1 em{font-style:italic;color:var(--text-muted)}
.subtitle{font-size:0.85rem;color:var(--text-hint);font-weight:300}
.progress-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.6rem}
.q-counter{font-size:0.78rem;color:var(--text-hint);font-weight:500;letter-spacing:0.04em;text-transform:uppercase}
.category-pill{font-size:0.72rem;padding:3px 10px;border-radius:20px;border:1px solid var(--border-med);color:var(--text-muted);font-weight:500}
.progress-track{height:3px;background:var(--border);border-radius:2px;margin-bottom:1.75rem;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width 0.35s ease}
.question-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem 1.75rem;margin-bottom:1rem}
.question-text{font-size:1rem;line-height:1.65;font-weight:400;color:var(--text)}
.multi-note{display:inline-flex;align-items:center;gap:5px;margin-top:0.6rem;font-size:0.76rem;color:var(--text-hint);background:var(--surface2);padding:3px 10px;border-radius:20px}
.options{display:flex;flex-direction:column;gap:7px;margin-bottom:1.25rem}
.opt{display:flex;align-items:flex-start;gap:11px;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);cursor:pointer;font-size:0.92rem;color:var(--text);line-height:1.55;text-align:left;transition:background 0.12s,border-color 0.12s,transform 0.08s;width:100%}
.opt:hover:not(:disabled){background:var(--surface2);border-color:var(--border-med)}
.opt:active:not(:disabled){transform:scale(0.995)}
.opt.selected{border-color:var(--accent);background:var(--accent-bg)}
.opt.correct{border-color:var(--success);background:var(--success-bg);color:var(--success)}
.opt.incorrect{border-color:var(--danger);background:var(--danger-bg);color:var(--danger)}
.opt.missed{border-color:var(--success);background:var(--success-bg);color:var(--success);opacity:0.7}
.opt:disabled{cursor:default}
.opt-key{font-size:0.72rem;font-weight:600;min-width:20px;padding-top:2px;opacity:0.45;letter-spacing:0.02em}
.action-row{display:flex;align-items:center;gap:10px}
.btn{padding:9px 20px;border:1px solid var(--border-med);border-radius:var(--radius);background:var(--surface);color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.88rem;font-weight:500;cursor:pointer;transition:background 0.12s}
.btn:hover:not(:disabled){background:var(--surface2)}
.btn:disabled{opacity:0.35;cursor:default}
.btn-accent{background:var(--accent);color:#fff;border-color:transparent}
.btn-accent:hover:not(:disabled){opacity:0.88;background:var(--accent)}
.explanation{margin-top:1rem;padding:13px 16px;border-left:3px solid var(--accent);background:var(--accent-bg);font-size:0.875rem;color:var(--text-muted);line-height:1.65;border-radius:0 var(--radius) var(--radius) 0;animation:fadeIn 0.2s ease}
.explanation strong{color:var(--text);font-weight:600}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.score-screen{animation:fadeIn 0.3s ease}
.score-hero{text-align:center;padding:2.5rem 1rem 1.5rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:1.5rem}
.score-num{font-family:'DM Serif Display',serif;font-size:4.5rem;font-weight:400;line-height:1;color:var(--text);letter-spacing:-0.03em}
.score-denom{font-size:1.2rem;color:var(--text-hint);margin-top:0.25rem}
.pass-badge{display:inline-block;margin-top:0.75rem;padding:4px 16px;border-radius:20px;font-size:0.8rem;font-weight:600;letter-spacing:0.05em;text-transform:uppercase}
.pass-badge.pass{background:var(--success-bg);color:var(--success)}
.pass-badge.fail{background:var(--danger-bg);color:var(--danger)}
.breakdown-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:1.5rem}
.cat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;text-align:center}
.cat-tile-name{font-size:0.72rem;color:var(--text-hint);margin-bottom:4px;font-weight:500}
.cat-tile-pct{font-size:1.4rem;font-weight:600}
.cat-tile-sub{font-size:0.7rem;color:var(--text-hint);margin-top:2px}
.pct-good{color:var(--success)}.pct-ok{color:var(--warn)}.pct-bad{color:var(--danger)}
.review-header{font-size:0.8rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.75rem;padding-top:0.5rem}
.review-item{border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;background:var(--surface)}
.review-q-text{font-size:0.875rem;margin-bottom:6px}
.review-ans{font-size:0.78rem;color:var(--danger);font-weight:500;margin-bottom:3px}
.review-correct{font-size:0.78rem;color:var(--success);font-weight:500;margin-bottom:5px}
.review-exp{font-size:0.78rem;color:var(--text-hint);line-height:1.5}
.score-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:0.5rem}
.loading{display:flex;align-items:center;gap:10px;color:var(--text-hint);font-size:0.9rem;padding:2rem 0}
.loading::before{content:'';width:18px;height:18px;border:2px solid var(--border-med);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="shell">
  <header class="site-header">
    <h1>GH-300 <em>Practice Quiz</em></h1>
    <p class="subtitle">GitHub Copilot Certification &nbsp;·&nbsp; 50 questions sampled from a pool of 200+ &nbsp;·&nbsp; Pass mark: 70%</p>
  </header>
  <div id="root"><div class="loading">Loading questions…</div></div>
</div>
<script src="quiz.js"></script>
<script>loadQuestions();</script>
</body>
</html>
